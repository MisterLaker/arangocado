

backups:
  - name: arangocado
    schedule: "0 * * * *"
    triggerImmediately: false
    host: "http+tcp://arango:8529"
    database: "arangocado"
    user: "root"
    password: ""
    historySize: 5
    collections:
      - some

    storages: [local, do]

  - name: "some_test"
    host: "http+tcp://arango:8529"
    database: "arangocado_test"
    user: "root"
    password: ""
    historySize: 5

    storages: [local]

storages:
  local:
    endpoint: "s3.somehost"
    accessKey: ""
    secretKey: ""
    bucket: "arangodb-backup"

  do:
    endpoint: "s3.someanotherhost.com"
    accessKey: ""
    secretKey: ""
    bucket: ""
    useSSL: true
    schedule: "0 */6 * * *"
