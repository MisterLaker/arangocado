apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arangocado.fullname" . }}
  labels:
    {{- include "arangocado.labels" . | nindent 4 }}
data:
  config: |
    checkInterval: "{{ .Values.checkInterval }}"
    cacheDir:  "{{ .Values.cacheDir }}"

    storages:
      {{- toYaml .Values.storages | nindent 6 }}

    backups:
      {{- toYaml .Values.backups | nindent 6 }}
